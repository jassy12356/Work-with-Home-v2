<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Work With Home</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
<h2>Work With Home</h2>
</header>

<div class="container">

<h2>Login</h2>

<form id="loginForm">

<input
type="email"
id="loginEmail"
placeholder="Email"
required>

<input
type="password"
id="loginPassword"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

<p>
Don't have an account?
<a href="register.html">Register</a>
</p>

</div>

<script type="module" src="js/auth.js"></script>

</body>
</html>
